name: Run Tests

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-tests:
    name: Desktop Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Enable Windows long paths for Git
        if: matrix.os == 'windows-latest'
        run: git config --global core.longpaths true

      - uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.os == 'ubuntu-latest'
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
          version: '1.0'

      - uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tests/src-tauri

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Run unit tests
        run: cargo test --release --features tests

      - name: Install plugin dependencies
        run: npm ci --ignore-scripts

      - name: Install test app dependencies
        working-directory: tests
        run: npm ci --ignore-scripts

      - name: Build test Tauri app
        working-directory: tests
        run: npm run tauri build -- -- --target-dir ../../target

      - name: Run tests (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: tests
        run: npm test

      - name: Run tests (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: tests
        run: xvfb-run -a npm test

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: tests
        run: npm test

  android-tests:
      name: Android Tests
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v6

        - name: Enable KVM
          run: |
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm

        - uses: ZhongRuoyu/setup-llvm@v0
          with:
            llvm-version: 22

        - uses: dtolnay/rust-toolchain@stable
          with:
            targets: x86_64-linux-android

        - uses: Swatinem/rust-cache@v2
          with:
            workspaces: tests/src-tauri

        - uses: actions/setup-node@v6
          with:
            node-version: 24
            cache: 'npm'
            cache-dependency-path: 'tests/package-lock.json'

        - name: Install plugin dependencies
          run: npm ci --ignore-scripts

        - name: Install test app dependencies
          working-directory: tests
          run: npm ci --ignore-scripts

        - name: Run tests
          uses: reactivecircus/android-emulator-runner@v2
          with:
            api-level: 36
            ndk: 27.2.12479018
            arch: x86_64
            target: google_apis
            disk-size: 5120M
            working-directory: tests
            script: |
              npm run tauri android build -- --debug --ci --apk --target x86_64
              npx appium --allow-insecure "*:chromedriver_autodownload" &
              APPIUM_PID=$!
              npm run test:android
              EXIT_CODE=$?
              kill $APPIUM_PID
              exit $EXIT_CODE
