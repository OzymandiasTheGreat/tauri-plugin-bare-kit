[package]
name = "tauri-plugin-bare-kit"
version = "0.1.0"
authors = ["You"]
description = ""
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-bare-kit"

[dependencies]
tauri = { version = "2.10.3" }
serde = "1.0"
thiserror = "2"
tokio = "1.48.0"

[target.'cfg(target_os = "android")'.dependencies]
base64 = "0.22.1"

[build-dependencies]
bindgen = "0.72.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tauri-plugin = { version = "2.5.4", features = ["build"] }

[features]
default = ["runtime"]
build = []
runtime = []
