
[package]
name = 'tauri-plugin-bare-kit'
version = '0.2.3'
authors = ['Tomas Ravinskas <tomas@tomasrav.me>']
description = 'Effortless JavaScript backends for Tauri apps - Android 🤖 iOS 📱Linux 🐧 Macos 🖥️ Windows 💩'
readme = 'README.md'
license = 'Apache-2.0'
repository = 'https://github.com/OzymandiasTheGreat/tauri-plugin-bare-kit'
keywords = ['javascript', 'cross-platform', 'tauri-plugin', 'bare-kit']
edition = '2021'
rust-version = '1.77.2'
exclude = ['/.vscode', '/api', '/example', '/node_modules', '/scripts']
links = 'tauri-plugin-bare-kit'

[dependencies]
tauri = { version = '2.11.2' }
parking_lot = '0.12'
serde = '1.0'
thiserror = '2'
tokio = '1'

[target.'cfg(target_os = "android")'.dependencies]
base64 = '0.22.1'

[dev-dependencies]
rand = '0.10'

[build-dependencies]
bindgen = '0.72.1'
serde = { version = '1.0', features = ['derive'] }
serde_json = '1.0'
tauri-plugin = { version = '2.6.2', features = ['build'] }

[features]
default = ['runtime']
build = []
runtime = []
tests = []
