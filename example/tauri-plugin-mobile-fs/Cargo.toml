[package]
name = "tauri-plugin-mobile-fs"
version = "0.1.0"
authors = ["Tomas Ravinskas <tomas@tomasrav.me>"]
description = "An example tauri plugin to aid in accessing filesystems on mobile"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/api", "/node_modules", "/package-lock.json", "/package.json"]
links = "tauri-plugin-mobile-fs"

[dependencies]
tauri = { version = "2.11.2" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.2", features = ["build"] }
